name: Update macro dashboard

on:
  schedule:
    # Weekdays. GitHub starts scheduled runs LATE, sometimes by several hours (2h40m to 7h seen on this repo), so
    # a late run must still build: there is no clock check any more. GitHub cron is UTC only and ignores US
    # daylight saving, so the pre-market run is listed for both seasons; the one that is off by an hour is a harmless extra refresh.
    #   1) pre-market, 6:15am New York     10:15 UTC (US summer time) and 11:15 UTC (US winter time)
    #   2) after the Asian close           10:30 UTC all year (India closes last, 10:00 UTC; Asia has no daylight saving)
    #   3) after the US close              21:45 UTC = 5:45pm New York in summer, 4:45pm in winter (always after the 4:00pm close)
    #      22:45 UTC backup, also picks up Treasury yields that are posted late in the evening
    - cron: "15 10 * * 1-5"
    - cron: "15 11 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "45 21 * * 1-5"
    - cron: "45 22 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" for an on-demand refresh
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", "movers.txt", "bloomberg/**", "weights/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh market data
        timeout-minutes: 9
        run: python scripts/fetch_data.py docs/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
