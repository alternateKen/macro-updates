name: Update macro dashboard

on:
  schedule:
    # GitHub cron is UTC only and ignores daylight saving, so each time is listed twice
    # (summer + winter) and the "gate" job below keeps only the one that is really
    # ~6:15am or ~4:45pm New York time. Early start leaves room for GitHub's queue delay.
    - cron: "15 10,11 * * 1-5"
    - cron: "45 20,21 * * 1-5"
  workflow_dispatch: {}   # lets you press "Run workflow" for an on-demand refresh
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          H=$(TZ=America/New_York date +%H)
          echo "New York hour is $H, event is ${{ github.event_name }}"
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$H" = "06" ] || [ "$H" = "16" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch fresh market data
        timeout-minutes: 4
        run: python scripts/fetch_data.py docs/data.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
