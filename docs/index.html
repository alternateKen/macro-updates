<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macro Morning Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#6a7280;--line:#e3e6eb;--up:#0b8a4b;--dn:#c62828;--acc:#2456d6;--bu:#2456d6;--am:#b26a00;--up-bg:#e1f3e9;--dn-bg:#fbe4e4;--bu-bg:#e2eafb;--am-bg:#fcefd6}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mute:#8b93a1;--line:#262c36;--up:#35c27a;--dn:#ef6a6a;--acc:#6e97ff;--bu:#6e97ff;--am:#e0a030;--up-bg:#12301f;--dn-bg:#3a1a1a;--bu-bg:#172846;--am-bg:#3a2d10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{padding:16px 20px 8px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;margin:0}
.stamp{color:var(--mute);font-size:12px}
nav{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 20px 8px;position:sticky;top:0;background:var(--bg);z-index:5}
nav a{flex:none;white-space:nowrap;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:4px 10px;border-radius:99px;font-size:12px}
main{padding:0 20px 40px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:hidden}
section.wide{grid-column:1/-1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);font-size:11px;text-align:right;padding:2px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
td.name{font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}
svg.spark{width:70px;height:20px;vertical-align:middle}
.hide-sm{display:table-cell}
@media(max-width:560px){.hide-sm{display:none}}
.news li{padding:6px 0;border-top:1px solid var(--line);list-style:none}
.news ul{margin:0;padding:0}
.news a{color:var(--ink);text-decoration:none}.news a:hover{color:var(--acc)}
.src{color:var(--mute);font-size:11px;margin-right:6px}
.banner{margin:0 20px 12px;padding:10px 12px;border:1px solid var(--dn);border-radius:8px;color:var(--dn);display:none}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.heat div{padding:8px;border-radius:6px;font-size:12px;color:#fff}
.heat b{display:block;font-size:14px}
#curve{width:100%;height:240px}
.legend span{margin-right:14px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
.note{color:var(--mute);font-size:12px;margin-top:6px}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit}

.snap-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-bottom:10px}
.snap-head h2{margin:0}
.tone{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.tone.up{color:var(--up);border-color:var(--up)}.tone.dn{color:var(--dn);border-color:var(--dn)}.tone.mu{color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.tl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tv{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.tc{font-size:12px;font-variant-numeric:tabular-nums;color:var(--mute)}
.snap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-bottom:10px}
h3{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;font-weight:600}
.snap-grid h3:first-child{margin-top:0}
.flags{margin:0;padding:0;list-style:none}
.flags li{padding:6px 0 6px 10px;border-left:3px solid var(--line);margin-bottom:6px;line-height:1.4}
.sub{font-size:11px;color:var(--mute);margin:6px 0 3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hl{margin:0;padding:0}

.bu{color:var(--bu)}.am{color:var(--am)}
.mvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;margin-bottom:8px}
.mvcard{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mvh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.mvh span{font-size:11px;color:var(--mute);white-space:nowrap}
.mvr{display:grid;grid-template-columns:minmax(90px,1.2fr) 1fr 66px;align-items:center;gap:8px;padding:3px 0;font-variant-numeric:tabular-nums}
.mvn{line-height:1.15;min-width:0}.mvn b{font-weight:600;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mvn small{display:block;color:var(--mute);font-size:10px}
.mvbar{position:relative;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mvbar i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}.mvbar i.up{background:var(--up)}.mvbar i.dn{background:var(--dn)}
.mvp{text-align:right;font-size:12px;font-weight:600;white-space:nowrap}
.mvp small{display:block;font-size:10px;font-weight:400;color:var(--mute)}
.mvr{grid-template-columns:minmax(80px,1.1fr) 1fr 92px}
.mvm{font-size:11px;color:var(--mute);margin:2px 0 3px}.mvm.approx{color:var(--am)}
.mvl{font-size:12px;margin:2px 0 4px}
button.seg{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:12px}
button.seg.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.bbg-asof{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--mute);margin-left:8px}.bbg-asof.am{color:var(--am);font-weight:600}
.rng{position:relative;display:inline-block;width:90px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle}
.rng i{position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--ink)}.rng i.dn{background:var(--dn)}
.rng u{position:absolute;top:-1px;width:2px;height:8px;background:var(--mute);text-decoration:none}
.legend{margin-top:4px}.legend span{margin-right:14px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
tr.grp td{padding:10px 6px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;border-top:1px solid var(--line);text-align:left}
.heat small{font-size:10px}
.tone.mu{color:var(--am);border-color:var(--am)}
.tile{border-left-width:4px}
.tile.up{background:var(--up-bg);border-color:var(--up)}.tile.dn{background:var(--dn-bg);border-color:var(--dn)}
.tile.bu{background:var(--bu-bg);border-color:var(--bu)}.tile.am{background:var(--am-bg);border-color:var(--am)}
.tile .tc.up{color:var(--up)}.tile .tc.dn{color:var(--dn)}.tile .tc.bu{color:var(--bu)}.tile .tc.am{color:var(--am)}
.tile .tc.up,.tile .tc.dn,.tile .tc.bu,.tile .tc.am{font-weight:600}
.flags li.up{border-left-color:var(--up);background:var(--up-bg)}.flags li.dn{border-left-color:var(--dn);background:var(--dn-bg)}
.flags li.bu{border-left-color:var(--bu);background:var(--bu-bg)}.flags li.am{border-left-color:var(--am);background:var(--am-bg)}
.flags li{padding-right:8px;border-radius:0 6px 6px 0}
.chip.up{background:var(--up-bg);border-color:var(--up)}.chip.dn{background:var(--dn-bg);border-color:var(--dn)}
.chip.bu{background:var(--bu-bg);border-color:var(--bu)}.chip.am{background:var(--am-bg);border-color:var(--am)}
</style>
</head>
<body>
<header>
  <h1>Macro Morning Dashboard</h1>
  <div class="stamp"><a href="https://alternateken.github.io/agentic-watchlist/" style="color:var(--acc);text-decoration:none">Watchlist &rarr;</a> &nbsp;·&nbsp; <span id="stamp">Loading…</span></div>
</header>
<div class="banner" id="banner"></div>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const fmt=(v,d=2)=>v==null||isNaN(v)?'–':v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=(v,d=2)=>v==null||isNaN(v)?'–':(v>0?'+':'')+v.toFixed(d)+'%';
const cls=v=>v==null?'':v>0?'up':v<0?'dn':'';
function digits(r){const p=Math.abs(r.last);return p<10?4:p<1000?2:0}
function spark(a,up){
  if(!a||a.length<2)return '';
  const mn=Math.min(...a),mx=Math.max(...a),w=70,h=20,rng=(mx-mn)||1;
  const pts=a.map((v,i)=>[(i/(a.length-1))*w,h-2-((v-mn)/rng)*(h-4)].map(x=>x.toFixed(1)).join(',')).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${pts}"/></svg>`;
}
function quoteTable(title,rows,isRate){
  if(!rows||!rows.length)return '';
  const body=rows.map(r=>{
    const d=isRate?2:digits(r);
    const chg=isRate?(r.chg==null?null:r.chg*100):null;   // rates: show bp change
    return `<tr><td class="name">${r.label}</td><td>${fmt(r.last,d)}</td>
      <td class="${cls(r.pct)}">${isRate?(chg==null?'–':(chg>0?'+':'')+chg.toFixed(1)+' bp'):pc(r.pct)}</td>
      ${isRate?'':`<td class="${cls(r.w1)} hide-sm">${pc(r.w1)}</td><td class="${cls(r.m1)} hide-sm">${pc(r.m1)}</td><td class="${cls(r.ytd)} hide-sm">${pc(r.ytd)}</td>`}
      <td class="${cls(r.pct)}">${spark(r.spark)}</td></tr>`}).join('');
  return `<section id="${slug(title)}"><h2>${title}</h2><table><tr><th></th><th>Last</th><th>${isRate?'Day chg':'Day'}</th>${isRate?'':'<th class="hide-sm">1W</th><th class="hide-sm">1M</th><th class="hide-sm">YTD</th>'}<th>45d</th></tr>${body}</table></section>`;
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
function heat(rows,id='sectors',title='Sector performance today (SPDR ETFs)'){
  const ordered=[...rows].sort((a,b)=>b.pct-a.pct);
  const col=p=>{const k=Math.min(Math.abs(p)/2,1);return p>=0?`rgba(11,138,75,${0.45+k*0.55})`:`rgba(198,40,40,${0.45+k*0.55})`};
  return `<section id="${id}"><h2>${title}</h2><div class="heat">`+
    ordered.map(r=>`<div style="background:${col(r.pct)}">${r.label}<b>${pc(r.pct)}</b></div>`).join('')+`</div></section>`;
}
// ---- Asia-Pacific: heatmap of the headline index per market, then every index grouped by market
const ASIA_HEAD=[['^N225','Japan'],['^KS11','Korea'],['^TWII','Taiwan'],['^HSCE','China H-shares'],['000300.SS','China A-shares'],['^STI','Singapore'],
  ['^JKSE','Indonesia'],['^KLSE','Malaysia'],['^SET.BK','Thailand'],['EPHE','Philippines'],['VNM','Vietnam (ETF)'],['^AXJO','Australia'],['^NSEI','India']];
function asiaGroups(S){return Object.keys(S).filter(k=>k.startsWith('Asia: ')).map(k=>[k.slice(6),S[k]])}
function asiaHeadRows(S){
  const all=asiaGroups(S).flatMap(([,rows])=>rows);
  return ASIA_HEAD.map(([sym,name])=>{const r=all.find(x=>x.symbol===sym);return r&&r.pct!=null?{...r,label:`${name}<small style="display:block;font-weight:400;opacity:.85">${r.label}</small>`}:null}).filter(Boolean);
}
function asiaBlock(S){
  const groups=asiaGroups(S);
  if(!groups.length)return '';
  const hr=asiaHeadRows(S);
  const up=hr.filter(r=>r.pct>0).length;
  const heatH=hr.length?heat(hr,'asia-heat',`Asia-Pacific today (final session) · ${up} of ${hr.length} markets higher`):'';
  const rowsH=groups.map(([name,rows])=>`<tr class="grp"><td colspan="7">${name}</td></tr>`+rows.map(r=>`<tr><td class="name">${r.label}</td><td>${fmt(r.last,digits(r))}</td>
      <td class="${cls(r.pct)}">${pc(r.pct)}</td><td class="${cls(r.w1)} hide-sm">${pc(r.w1)}</td><td class="${cls(r.m1)} hide-sm">${pc(r.m1)}</td><td class="${cls(r.ytd)} hide-sm">${pc(r.ytd)}</td>
      <td class="${cls(r.pct)}">${spark(r.spark)}</td></tr>`).join('')).join('');
  const table=`<section id="asia-pacific-indices" class="wide"><h2>Asia-Pacific indices</h2><table><tr><th></th><th>Last</th><th>Day</th><th class="hide-sm">1W</th><th class="hide-sm">1M</th><th class="hide-sm">YTD</th><th>45d</th></tr>${rowsH}</table>
    <div class="note">Day = the latest completed session in each market (all closed before the New York morning). Vietnam is shown through a US-listed ETF because Yahoo carries no free VN-Index feed.</div></section>`;
  return heatH.replace('<section id="asia-heat">','<section id="asia-heat" class="wide">')+table+quoteTable('Asia FX',S['Asia FX']);
}
function curveChart(c){
  if(!c.length)return '';
  const W=640,H=240,L=38,R=10,T=10,B=24;
  const vals=c.flatMap(p=>[p.now,p.w1,p.m1,p.y1]).filter(v=>v!=null);
  const mn=Math.floor(Math.min(...vals)*4)/4,mx=Math.ceil(Math.max(...vals)*4)/4;
  const x=i=>L+i*(W-L-R)/(c.length-1),y=v=>T+(mx-v)/(mx-mn||1)*(H-T-B);
  const line=(k,color,dash)=>{const pts=c.map((p,i)=>p[k]==null?null:`${x(i)},${y(p[k])}`).filter(Boolean).join(' ');return `<polyline fill="none" stroke="${color}" stroke-width="${k=='now'?2.5:1.5}" ${dash?'stroke-dasharray="4 3"':''} points="${pts}"/>`};
  let grid='';for(let g=mn;g<=mx+1e-9;g+=(mx-mn>3?1:0.5)){grid+=`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end" font-size="10" fill="var(--mute)">${g.toFixed(1)}</text>`}
  const labs=c.map((p,i)=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--mute)">${p.label}</text>`).join('');
  return `<svg id="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${labs}${line('y1','#9aa3b2',1)}${line('m1','#e0a030',1)}${line('w1','#4aa3df',1)}${line('now','var(--acc)')}</svg>
   <div class="legend"><span><i style="background:var(--acc)"></i>Latest (${c.find(p=>p.label=='10Y')?.date||''})</span><span><i style="background:#4aa3df"></i>1 week ago</span><span><i style="background:#e0a030"></i>1 month ago</span><span><i style="background:#9aa3b2"></i>1 year ago</span></div>`;
}
function ratesBlock(d){
  const g=id=>d.curve.find(p=>p.label==id);
  const two=g('2Y'),ten=g('10Y');
  const rows=d.fred.map(r=>{
    const bp=r.d1==null?null:r.d1*100;
    return `<tr><td class="name">${r.label}</td><td>${fmt(r.now,2)}${r.id.startsWith('BAML')||r.id.startsWith('T10Y')||r.id=='DFII10'||r.id=='DFF'?'%':''}</td><td class="${cls(bp)}">${bp==null?'–':(bp>0?'+':'')+bp.toFixed(1)+' bp'}</td><td class="hide-sm">${fmt(r.w1,2)}</td><td class="hide-sm">${fmt(r.m1,2)}</td><td>${r.date.slice(5)}</td></tr>`}).join('');
  const steep=two&&ten?`<div class="note">Today's 2s10s: <b>${((ten.now-two.now)*100).toFixed(0)} bp</b> (1 month ago: ${two.m1!=null&&ten.m1!=null?((ten.m1-two.m1)*100).toFixed(0):'–'} bp). Treasury data is end-of-day and lags by one business day.</div>`:'';
  return `<section id="curve-sec" class="wide"><h2>US Treasury yield curve</h2>${curveChart(d.curve)}${steep}</section>
  <section id="spreads"><h2>Spreads, real yields &amp; credit (US Treasury / FRED)</h2><table><tr><th></th><th>Now</th><th>1-day</th><th class="hide-sm">1W ago</th><th class="hide-sm">1M ago</th><th>As of</th></tr>${rows}</table></section>`;
}
function newsBlock(items){
  if(!items.length)return '';
  const li=items.map(n=>`<li><span class="src">${n.source}</span><a href="${n.link}" target="_blank" rel="noopener">${n.title}</a></li>`).join('');
  return `<section id="news" class="news"><h2>Headlines</h2><ul>${li}</ul></section>`;
}
function briefText(d){
  const L=[];const f=(v,x=2)=>v==null?'n/a':v.toFixed(x);const p=v=>v==null?'n/a':(v>0?'+':'')+v.toFixed(2)+'%';
  L.push('You are my macro strategist. I am an equity fund manager and trader. Using ONLY the data below (do not invent or assume any numbers), write my morning macro brief:');
  L.push('1. Five-bullet overview of what matters most today.');
  L.push('2. Rates and curve: level and direction of 2y/10y/30y, 2s10s steepening or flattening, real yields vs breakevens, credit spreads. What is the bond market saying?');
  L.push('3. Equities: futures vs yesterday, sector leaders and laggards, VIX/MOVE, mega-cap and breadth signals (equal-weight vs cap-weight, small caps).');
  L.push('4. Commodities, dollar, FX, crypto: the main moves and what they imply for inflation, growth and risk appetite.');
  L.push('5. Cross-asset consistency: where do the signals agree or disagree? What looks odd?');
  L.push('6. Levels and risks to watch today, including any US data releases or Fed speakers from the headlines.');
  L.push('Be concise, use short bullets, and say clearly where data is end-of-day (Treasury, MOF, FRED) rather than live.');
  L.push('','DATA (generated '+d.generated+')');
  for(const [sec,rows] of Object.entries(d.sections)){
    L.push('','## '+sec);
    rows.forEach(r=>L.push(`${r.label}: ${f(r.last,Math.abs(r.last)<10?4:2)} | day ${p(r.pct)} | 1W ${p(r.w1)} | 1M ${p(r.m1)} | YTD ${p(r.ytd)} | 52w range ${f(r.lo52)}-${f(r.hi52)}`));
  }
  L.push('','## US Treasury curve, % (latest | 1W ago | 1M ago | 1Y ago), Treasury end-of-day');
  d.curve.forEach(c=>L.push(`${c.label}: ${f(c.now)} | ${f(c.w1)} | ${f(c.m1)} | ${f(c.y1)}`));
  L.push('','## Spreads, real yields, credit (FRED, now | 1-day change | 1W ago | 1M ago)');
  d.fred.forEach(r=>L.push(`${r.label}: ${f(r.now)} | ${f(r.d1,3)} | ${f(r.w1)} | ${f(r.m1)}`));
  L.push('','## Japan JGB yields % (now | 1-day change | 1W ago | 1M ago), MOF end-of-day');
  (d.jgb||[]).forEach(r=>L.push(`${r.label}: ${f(r.now,3)} | ${f(r.d1,3)} | ${f(r.w1,3)} | ${f(r.m1,3)}`));
  Object.entries(d.movers||{}).forEach(([name,m])=>{
    const u=m.unit,fv=r=>u==='bp'?f(r.c,1)+' bp':u==='pts'?f(r.c,1)+' pts':f(r.c,2)+'%';
    L.push('',`## Top movers: ${name} (${m.method}; ranked by contribution to the index move; ${m.adv} up / ${m.dec} down of ${m.loaded}${m.index?`; index ${f(m.index.pct,2)}%`:''})`);
    L.push('Positive: '+m.gainers.map(r=>`${r.label} (${r.symbol}) ${fv(r)} [${f(r.pct,2)}% move${r.w!=null?', '+f(r.w,1)+'% weight':''}]`).join('; '));
    L.push('Negative: '+m.losers.map(r=>`${r.label} (${r.symbol}) ${fv(r)} [${f(r.pct,2)}% move${r.w!=null?', '+f(r.w,1)+'% weight':''}]`).join('; '));
  });
  if(d.bbg&&d.bbg.wirp){const w=d.bbg.wirp;L.push('',`## Fed funds futures pricing (Bloomberg WIRP, as of ${w.asof}; plus = hikes, minus = cuts; target ${w.target}%, effective ${w.effective}%)`);
    w.meetings.forEach(m=>L.push(`${m.date}: cumulative ${f(m.cum,2)} | ${f(m.pct,1)}% at meeting | implied rate ${f(m.rate,3)}%`));
    if(d.bbg.wirp_global)L.push('Next-meeting hike(+)/cut(-) odds: '+d.bbg.wirp_global.rows.map(r=>`${r.model} ${r.date} ${f(r.pct,1)}%`).join('; '));}
  if(d.bbg&&d.bbg.credit){L.push('',`## Credit indices (Bloomberg, as of ${d.bbg.credit.asof}; level | day chg | vs 3M avg | 3M chg | 3M low-high; price-quoted indices marked: a falling price = wider spreads)`);

  const es=q('ES=F'),nq=q('NQ=F');
  const eqm=[es,nq].filter(r=>r&&r.pct!=null&&Math.abs(r.pct)>=0.5);
  if(eqm.length){const av=eqm.reduce((p,r)=>p+r.pct,0)/eqm.length;
    F.push([`<b>Equities:</b> ${eqm.map(r=>col(`${r.label} ${pc(r.pct)}`,cm(r.symbol,r.pct))).join(', ')}`,cm('ES=F',av)])}
  // ---- Bloomberg lines: Fed / central-bank pricing, credit, data ahead
  const bb=d.bbg||{};
  if(bb.wirp&&bb.wirp.meetings.length){
    const M=bb.wirp.meetings,nx=M[0],lim=Date.now()+365*864e5;
    const y1=M.filter(m=>new Date(m.date+'T12:00:00')<=lim).pop()||M[M.length-1];
    const k=y1.cum>0.5?'dn':y1.cum<-0.5?'up':dcl(y1.cum);
    const odds=nx.pct==null?'':`${Math.abs(nx.pct).toFixed(0)}% ${nx.pct>=0?'hike':'cut'} odds`;
    F.push([`<b>Fed pricing:</b> next meeting ${mdate(nx.date)} ${col(odds,hikeCls(nx.pct)||'flat')} · ${col(`${hcs(y1.cum)} ${y1.cum>=0?'hikes':'cuts'} priced by ${mdate(y1.date)}`,k)} · implied ${y1.rate.toFixed(2)}% vs ${bb.wirp.effective!=null?bb.wirp.effective.toFixed(2):'–'}% effective ${asofTag(bb.wirp.asof,1)}`,k]);
  }
  if(bb.credit&&bb.credit.rows.length){
    const names=['CDX Investment Grade','CDX High Yield','iTraxx Europe','iTraxx Crossover'];
    const rs=names.map(n=>bb.credit.rows.find(r=>r.index===n)).filter(Boolean);
    if(rs.length>=3){
      const wide=rs.filter(r=>widen(r,r.chg)>0).length;
      const k=wide>=Math.ceil(rs.length*0.75)?'dn':wide<=Math.floor(rs.length*0.25)?'up':'am';
      const part=r=>{const w=widen(r,r.chg),near=r.high!=null&&r.low!=null&&r.high>r.low&&(r.quote==='price'?(r.level-r.low)/(r.high-r.low)<=0.15:(r.level-r.low)/(r.high-r.low)>=0.9);
        return col(`${r.index.replace('Investment Grade','IG').replace('High Yield','HY')} ${r.level.toFixed(r.quote==='price'?2:(r.level<100?1:0))} (${hcs(r.chg,2)})${near?' near 3M wide':''}`,wideCls(w)||'flat')};
      F.push([`<b>Credit:</b> ${rs.map(part).join(' · ')} ${asofTag(bb.credit.asof,1)}`,k]);
    }
  }
  if(bb.eco&&bb.eco.events.length){
    const now=Date.now(),keyEv=bb.eco.events.filter(x=>ECO_KEY.test(x.event)&&new Date(x.time)>=now-2*3600e3);
    let sel=keyEv.filter(x=>new Date(x.time)<=now+48*3600e3);
    const near=sel.length>0;
    if(!near)sel=keyEv.slice(0,4);
    if(sel.length){
      const etf=iso=>new Date(iso).toLocaleString('en-US',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/New_York'});
      const byT={};sel.forEach(x=>(byT[x.time]=byT[x.time]||[]).push(x));
      const txt=Object.entries(byT).slice(0,4).map(([t,xs])=>`<b>${etf(t)} ET</b> ${xs.map(x=>`${escH(x.event)}${x.survey?` (exp ${escH(x.survey)})`:''}`).join(', ')}`).join(' · ');
      F.push([`<b>${near?'Data in the next 48h':'Next key data'}:</b> ${txt}`,'bu']);
    }
  }
  // Asia-Pacific: how many of the headline markets closed higher, plus leaders and laggards
  const ah=asiaHeadRows(d.sections);
  if(ah.length>=4){
    const plain=r=>r.label.replace(/<small.*$/,'');
    const srt=ah.slice().sort((a,b)=>b.pct-a.pct), up=ah.filter(r=>r.pct>0).length, av=ah.reduce((p,r)=>p+r.pct,0)/ah.length;
    const k=av>0.15?'up':av<-0.15?'dn':dcl(av);
    F.push([`<b>Asia-Pacific:</b> ${col(`${up} of ${ah.length} markets higher (avg ${pc(av)})`,k)} · leaders ${srt.slice(0,2).map(r=>`${plain(r)} ${pc(r.pct)}`).join(', ')} · laggards ${srt.slice(-2).reverse().map(r=>`${plain(r)} ${pc(r.pct)}`).join(', ')}`,k]);
  }
  const vix=q('^VIX');
  if(vix){const v=vix.last,rg=v<15?['calm','up']:v<20?['normal','flat']:v<25?['elevated','dn']:['high stress','dn'];
    F.push([`<b>Volatility:</b> VIX ${fmt(v,1)} ${col(pc(vix.pct),cm('^VIX',vix.pct))} – ${col(rg[0],rg[1])}${vix.pct!=null&&Math.abs(vix.pct)>=5?', sharp move':''}`,
      v>=20?'dn':cm('^VIX',vix.pct)==='flat'?rg[1]:cm('^VIX',vix.pct)])}
  const t2=c('2Y'),t10c=c('10Y');
  if(s210&&t2&&t10c&&t2.w1!=null&&t10c.w1!=null){
    const ch=((t10c.now-t2.now)-(t10c.w1-t2.w1))*100, lvl=(s210.now*100).toFixed(0);
    if(Math.abs(ch)>=3)F.push([`<b>Curve:</b> 2s10s at ${lvl} bp${s210.now<0?' (inverted)':''}; ${col((ch>0?'steepened ':'flattened ')+Math.abs(ch).toFixed(0)+' bp over 1 week',dcl(ch))}`,dcl(ch)])}   // unchanged curve is not news; the tile shows the level
  if(t10&&t10.chg!=null&&Math.abs(t10.chg*100)>=5){const k=cm('^TNX',t10.chg);F.push([`<b>Rates:</b> US 10y ${col((t10.chg>0?'up ':'down ')+Math.abs(t10.chg*100).toFixed(1)+' bp',k)} to ${fmt(t10.last,2)}%`,k])}
  if(j10&&j10.d1!=null&&Math.abs(j10.d1*100)>=3){const k=j10.d1>0?'dn':'up';F.push([`<b>Japan:</b> JGB 10y ${col((j10.d1>0?'up ':'down ')+Math.abs(j10.d1*100).toFixed(1)+' bp',k)} to ${fmt(j10.now,2)}%`,k])}
  const spx=q('^GSPC'),rsp=q('RSP');
  if(spx&&rsp&&spx.pct!=null&&rsp.pct!=null){const df=rsp.pct-spx.pct;if(Math.abs(df)>=0.3){const k=df>0?'up':'dn';F.push([`<b>Breadth:</b> ${col(df>0?'broad participation – equal-weight beating cap-weight':'narrow – mega-caps leading equal-weight',k)} (${df>0?'+':''}${df.toFixed(2)}%)`,k])}}
  const hyg=q('HYG');if(hyg&&hyg.pct!=null&&Math.abs(hyg.pct)>=0.4){const k=cm('HYG',hyg.pct);F.push([`<b>Credit:</b> high-yield bonds ${col(hyg.pct>0?'firm':'weak',k)} (HYG ${pc(hyg.pct)})`,k])}
  [['CL=F','Oil'],['GC=F','Gold'],['HG=F','Copper'],['NG=F','Nat gas']].forEach(([s,n])=>{const r=q(s);if(r&&r.pct!=null&&Math.abs(r.pct)>=2){const k=cm(s,r.pct);F.push([`<b>${n}:</b> ${col(pc(r.pct),k)} to ${fmt(r.last,2)}`,k])}});
  const dx=q('DX-Y.NYB');if(dx&&dx.pct!=null&&Math.abs(dx.pct)>=0.5){const k=cm('DX-Y.NYB',dx.pct);F.push([`<b>Dollar:</b> ${col((dx.pct>0?'stronger':'weaker')+` (${pc(dx.pct)})`,k)}`,k])}
  if(!F.length)F.push(['Nothing unusual on the numbers today.','flat']);

  const sec=(d.sections['Sectors (SPDR ETFs)']||[]).slice().sort((a,b)=>b.pct-a.pct);
  const chip=r=>`<span class="chip ${cm(r.symbol,r.pct)}">${arrow(r.pct)}${r.label} ${pc(r.pct)}</span>`;
  const sectors=sec.length>=6?`<div class="sub">Leaders</div><div class="chips">${sec.slice(0,3).map(chip).join('')}</div><div class="sub">Laggards</div><div class="chips">${sec.slice(-3).reverse().map(chip).join('')}</div>`:'';
  const seen=new Set();
  const mm=all.filter(r=>r.pct!=null&&Math.abs(r.pct)>=2&&!seen.has(r.label)&&seen.add(r.label)).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct)).slice(0,8);
  const movers=mm.length?`<div class="sub">Moves of 2% or more</div><div class="chips">${mm.map(chip).join('')}</div>`:'';
  const hl=d.news.slice(0,4).map(n=>`<li><span class="src">${n.source}</span><a href="${n.link}" target="_blank" rel="noopener">${n.title}</a></li>`).join('');

  return `<section id="snapshot" class="wide">
   <div class="snap-head"><h2>Morning snapshot</h2><span class="tone ${tone[1]}">${tone[1]==='up'?'▲ ':tone[1]==='dn'?'▼ ':'● '}${tone[0]}</span><span class="note">Auto-generated from fixed rules on the data below, not AI</span></div>
   <div class="tiles">${tiles}</div>
   <div class="note" style="margin:-6px 0 12px"><span class="up">Green</span> = good for markets (stocks up, VIX down, yields down, dollar weaker, credit firmer) · <span class="dn">red</span> = bad for markets · <span class="bu">blue ▲</span> / <span class="am">amber ▼</span> = direction only, where there is no clear market read (oil, gold, FX pairs, curve). Arrows show the direction of the move.</div>
   <div class="snap-grid">
     <div><h3>What stands out</h3><ul class="flags">${F.map(([x,k])=>`<li class="${k}">${x}</li>`).join('')}</ul></div>
     <div><h3>Where the action is</h3>${sectors}${movers}</div>
   </div>
   ${moversBlock(d)}
   ${hl?`<h3>Top headlines</h3><ul class="hl news">${hl}</ul>`:''}
  </section>`;
}
function claudeBlock(){
  return `<section id="claude-brief" class="wide"><h2>Daily brief with Claude (free with your Claude Pro chat)</h2>
  <button id="copybtn" style="padding:10px 16px;font-size:14px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer">Copy brief for Claude</button>
  <span id="copymsg" class="note"></span>
  <div class="note">1) Press the button. 2) Open <a href="https://claude.ai/new" target="_blank" rel="noopener" style="color:var(--acc)">claude.ai/new</a>. 3) Paste (Ctrl+V or Cmd+V) and press Enter.</div></section>`;
}
const calendar=`<section id="calendar"><h2>Economic calendar (US, high/medium impact)</h2>
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div></section>`;
const notes=`<section id="notes"><h2>My notes for today (saved only in this browser)</h2><textarea id="note" placeholder="Bloomberg takeaways, levels to watch, trade ideas…"></textarea></section>`;

function render(d){
  const S=d.sections;
  const gen=new Date(d.generated);
  document.getElementById('stamp').textContent='Data refreshed '+gen.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'})+' · Yahoo Finance · US Treasury · NY Fed · Japan MOF · FRED · RSS';
  const age=(Date.now()-gen)/36e5;
  if(age>30){const b=document.getElementById('banner');b.style.display='block';b.textContent=`Warning: this data is ${Math.round(age)} hours old. The automatic refresh may have failed (check the Actions tab in GitHub).`}
  const parts=[
    snapshot(d),quoteTable('Futures',S['Futures']),quoteTable('US Indices',S['US Indices']),
    S['Sectors (SPDR ETFs)']?heat(S['Sectors (SPDR ETFs)']):'',
    ratesBlock(d),bbgRates(d),quoteTable('Rates (Yahoo, intraday)',S['Rates (Yahoo, intraday)'],true),jgbBlock(d.jgb),
    bbgCredit(d),quoteTable('Volatility & Credit ETFs',S['Volatility & Credit ETFs']),quoteTable('Mega-caps & Themes',S['Mega-caps & Themes']),quoteTable('Energy',S['Energy']),quoteTable('Metals',S['Metals']),quoteTable('Agriculture',S['Agriculture']),quoteTable('Other commodities',S['Other commodities']),
    quoteTable('FX',S['FX']),quoteTable('Crypto',S['Crypto']),quoteTable('Europe Indices',S['Europe Indices']),asiaBlock(S),
    bbgEco(d),claudeBlock(),newsBlock(d.news),calendar,notes
  ].join('');
  document.getElementById('main').innerHTML=parts;
  wireEco(d);
  const ids=[['snapshot','Snapshot'],['futures','Futures'],['us-indices','Equities'],['sectors','Sectors'],['curve-sec','Curve'],['rates-yahoo-intraday','Rates'],['jgb','JGB'],['bbg-rates','Fed odds'],['bbg-credit','Credit'],['bbg-eco','Data'],['energy','Energy'],['metals','Metals'],['fx','FX'],['crypto','Crypto'],['asia-heat','Asia'],['europe-indices','Europe'],['claude-brief','Claude'],['news','News'],['calendar','Calendar'],['notes','Notes']];
  document.getElementById('nav').innerHTML=ids.filter(([i])=>document.getElementById(i)).map(([i,l])=>`<a href="#${i}">${l}</a>`).join('');
  const n=document.getElementById('note');
  try{n.value=localStorage.getItem('macro-note-'+new Date().toDateString())||'';n.addEventListener('input',()=>localStorage.setItem('macro-note-'+new Date().toDateString(),n.value))}catch(e){}
  const s=document.createElement('script');s.type='text/javascript';s.async=true;
  s.src='https://s3.tradingview.com/external-embedding/embed-widget-events.js';
  s.text=JSON.stringify({colorTheme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',isTransparent:true,width:'100%',height:'450',locale:'en',importanceFilter:'0,1',countryFilter:'us'});
  document.querySelector('.tradingview-widget-container').appendChild(s);
  const cb=document.getElementById('copybtn'),cm=document.getElementById('copymsg');
  cb.addEventListener('click',async()=>{
    const t=briefText(d);
    try{await navigator.clipboard.writeText(t);cm.textContent=' Copied! Now paste it into Claude.'}
    catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');cm.textContent=' Copied! Now paste it into Claude.'}catch(_){cm.textContent=' Copy blocked by your browser.'}ta.remove()}
  });
  if(d.errors&&d.errors.length)console.warn('Some feeds failed:',d.errors);
}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(render).catch(e=>{document.getElementById('stamp').textContent='Could not load data.json — '+e});
</script>
